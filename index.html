<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAILY — Smart Daily Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            iosBg: '#F5F5F7',
            iosPrimary: '#007AFF',
            iosText: '#1D1D1F',
            iosSecondary: '#86868B',
          }
        }
      }
    }
  </script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .dark .glass {
      background: rgba(28, 28, 30, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* Hide scrollbar for clean UI */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#F5F5F7] dark:bg-black text-[#1D1D1F] dark:text-gray-100 h-full font-sans antialiased selection:bg-blue-500 selection:text-white">
  <div id="root" class="h-full"></div>

  <!-- React & Dependencies CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Data Awal Mock
    const initialTasks = [
      { id: '1', title: 'Review Desain UI Rezaquran Studio', task_date: new Date().toISOString().split('T')[0], start_time: '09:00', end_time: '10:30', priority: 'high', status: 'completed', category: 'Work' },
      { id: '2', title: 'Persiapan Modul Kelas Menggambar', task_date: new Date().toISOString().split('T')[0], start_time: '11:00', end_time: '12:30', priority: 'critical', status: 'in_progress', category: 'Work' },
      { id: '3', title: 'Olahraga Pagi & Hydration Check', task_date: new Date().toISOString().split('T')[0], start_time: '06:00', end_time: '07:00', priority: 'medium', status: 'completed', category: 'Health' },
      { id: '4', title: 'Meeting Branding Kopi Kandar', task_date: new Date().toISOString().split('T')[0], start_time: '14:00', end_time: '15:30', priority: 'high', status: 'todo', category: 'Creative Project' }
    ];

    const initialNotes = [
      { id: '1', title: 'Ide Ilustrasi Baru', content: 'Konsep karakter minimalis dengan sentuhan gaya urban modern.' },
      { id: '2', title: 'Catatan Rapat Client', content: 'Revisi warna standing pouch bear.isik! disesuaikan dengan sampel terbaru.' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [userRole, setUserRole] = useState('admin');
      const [tasks, setTasks] = useState(() => JSON.parse(localStorage.getItem('daily_tasks')) || initialTasks);
      const [notes, setNotes] = useState(() => JSON.parse(localStorage.getItem('daily_notes')) || initialNotes);
      
      // Form States
      const [newTaskTitle, setNewTaskTitle] = useState('');
      const [newTaskCategory, setNewTaskCategory] = useState('Work');
      const [newTaskPriority, setNewTaskPriority] = useState('medium');
      const [newNoteTitle, setNewNoteTitle] = useState('');
      const [newNoteContent, setNewNoteContent] = useState('');

      // Focus Mode States
      const [focusTime, setFocusTime] = useState(25 * 60);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // Save LocalStorage
      useEffect(() => {
        localStorage.setItem('daily_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('daily_notes', JSON.stringify(notes));
      }, [notes]);

      // Timer Logic
      useEffect(() => {
        let timer = null;
        if (isTimerRunning && focusTime > 0) {
          timer = setInterval(() => setFocusTime(t => t - 1), 1000);
        } else if (focusTime === 0) {
          setIsTimerRunning(false);
          alert('Sesi Fokus Selesai! Saatnya beristirahat.');
        }
        return () => clearInterval(timer);
      }, [isTimerRunning, focusTime]);

      // Handlers
      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) return;
        const task = {
          id: Date.now().toString(),
          title: newTaskTitle,
          task_date: new Date().toISOString().split('T')[0],
          start_time: '10:00',
          end_time: '11:00',
          priority: newTaskPriority,
          status: 'todo',
          category: newTaskCategory
        };
        setTasks([task, ...tasks]);
        setNewTaskTitle('');
      };

      const handleAddNote = (e) => {
        e.preventDefault();
        if (!newNoteTitle.trim()) return;
        const note = {
          id: Date.now().toString(),
          title: newNoteTitle,
          content: newNoteContent
        };
        setNotes([note, ...notes]);
        setNewNoteTitle('');
        setNewNoteContent('');
      };

      const toggleTaskStatus = (id) => {
        setTasks(tasks.map(t => {
          if (t.id === id) {
            return { ...t, status: t.status === 'completed' ? 'todo' : 'completed' };
          }
          return t;
        }));
      };

      const deleteTask = (id) => {
        if (confirm('Hapus agenda ini?')) {
          setTasks(tasks.filter(t => t.id !== id));
        }
      };

      const deleteNote = (id) => {
        if (confirm('Hapus catatan ini?')) {
          setNotes(notes.filter(n => n.id !== id));
        }
      };

      const exportCSV = () => {
        const headers = "ID,Judul,Tanggal,Prioritas,Status,Kategori\n";
        const rows = tasks.map(t => `"${t.id}","${t.title}","${t.task_date}","${t.priority}","${t.status}","${t.category}"`).join("\n");
        const blob = new Blob([headers + rows], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `DAILY_Export_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
      };

      const completedCount = tasks.filter(t => t.status === 'completed').length;
      const progressPercent = tasks.length > 0 ? Math.round((completedCount / tasks.length) * 100) : 0;

      return (
        <div class="flex h-screen overflow-hidden">
          <!-- Sidebar iOS Glass Style (Desktop) -->
          <aside class="w-64 glass hidden md:flex flex-col justify-between p-5 border-r border-gray-200/50 dark:border-gray-800/50">
            <div>
              <div class="flex items-center gap-3 px-2 py-4 mb-4">
                <div class="w-9 h-9 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-blue-500/30">D</div>
                <div>
                  <h1 class="font-black text-xl tracking-tight leading-none">DAILY</h1>
                  <span class="text-[10px] text-gray-400 font-medium tracking-widest uppercase">Smart Planner</span>
                </div>
              </div>

              <nav class="space-y-1">
                {[
                  { id: 'dashboard', label: 'Dashboard' },
                  { id: 'tasks', label: 'Agenda Saya' },
                  { id: 'focus', label: 'Focus Mode' },
                  { id: 'notes', label: 'Catatan & Ide' },
                  { id: 'stats', label: 'Statistik' },
                  { id: 'admin', label: 'Admin Panel' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    class={`w-full text-left px-4 py-3 rounded-2xl font-semibold text-sm transition-all duration-200 ${
                      activeTab === tab.id
                        ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20 scale-[1.02]'
                        : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100/70 dark:hover:bg-gray-800/70'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </nav>
            </div>

            <div class="p-3 glass rounded-2xl border border-gray-200/40 dark:border-gray-800/40 text-xs text-gray-500 space-y-1">
              <div class="flex justify-between items-center">
                <span>Role Pengguna:</span>
                <span class="font-bold uppercase text-blue-600">{userRole}</span>
              </div>
              <button 
                onClick={() => setUserRole(userRole === 'admin' ? 'user' : 'admin')}
                class="w-full text-center text-[11px] text-gray-400 hover:text-blue-500 pt-1 underline"
              >
                Ganti Role Akses
              </button>
            </div>
          </aside>

          <!-- Main View Area -->
          <main class="flex-1 overflow-y-auto no-scrollbar p-4 md:p-8">
            <!-- Mobile Header Navigation -->
            <div class="md:hidden flex justify-between items-center mb-6 glass p-4 rounded-2xl shadow-sm">
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-sm">D</div>
                <span class="font-extrabold tracking-tight">DAILY</span>
              </div>
              <select 
                value={activeTab} 
                onChange={(e) => setActiveTab(e.target.value)}
                class="bg-transparent border border-gray-300 dark:border-gray-700 rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none"
              >
                <option value="dashboard">Dashboard</option>
                <option value="tasks">Agenda Saya</option>
                <option value="focus">Focus Mode</option>
                <option value="notes">Catatan & Ide</option>
                <option value="stats">Statistik</option>
                <option value="admin">Admin Panel</option>
              </select>
            </div>

            <!-- DASHBOARD TAB -->
            {activeTab === 'dashboard' && (
              <div class="max-w-4xl mx-auto space-y-6">
                <div class="glass p-6 md:p-8 rounded-3xl shadow-sm">
                  <p class="text-xs font-bold text-blue-600 uppercase tracking-widest">Agenda Hari Ini</p>
                  <h2 class="text-3xl font-black tracking-tight mt-1">Selamat Datang 👋</h2>
                  <p class="text-gray-500 dark:text-gray-400 mt-1 text-sm">Fokus pada pekerjaan penting dan tingkatkan produktivitas harian Anda.</p>
                </div>

                {/* Progress Indicators */}
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div class="glass p-5 rounded-3xl">
                    <p class="text-xs text-gray-500 font-medium">Total Agenda</p>
                    <p class="text-3xl font-black mt-1">{tasks.length}</p>
                  </div>
                  <div class="glass p-5 rounded-3xl">
                    <p class="text-xs text-gray-500 font-medium">Selesai</p>
                    <p class="text-3xl font-black text-green-500 mt-1">{completedCount}</p>
                  </div>
                  <div class="glass p-5 rounded-3xl">
                    <p class="text-xs text-gray-500 font-medium">Belum Selesai</p>
                    <p class="text-3xl font-black text-orange-500 mt-1">{tasks.length - completedCount}</p>
                  </div>
                  <div class="glass p-5 rounded-3xl">
                    <p class="text-xs text-gray-500 font-medium">Produktivitas</p>
                    <p class="text-3xl font-black text-blue-600 mt-1">{progressPercent}%</p>
                    <div class="w-full bg-gray-200 dark:bg-gray-700 h-1.5 rounded-full mt-2 overflow-hidden">
                      <div class="bg-blue-600 h-full transition-all duration-500" style={{ width: `${progressPercent}%` }}></div>
                    </div>
                  </div>
                </div>

                {/* Quick Add Form */}
                <form onSubmit={handleAddTask} class="glass p-3 rounded-2xl flex flex-col md:flex-row gap-3 shadow-sm border border-white/40">
                  <input 
                    type="text" 
                    placeholder="+ Tambah agenda baru harian..."
                    value={newTaskTitle}
                    onChange={(e) => setNewTaskTitle(e.target.value)}
                    class="flex-1 bg-transparent border-none outline-none text-sm px-3 py-2 placeholder-gray-400"
                  />
                  <div class="flex gap-2">
                    <select 
                      value={newTaskCategory}
                      onChange={(e) => setNewTaskCategory(e.target.value)}
                      class="bg-gray-100/80 dark:bg-gray-800/80 text-xs rounded-xl px-3 py-2 border-none outline-none font-medium"
                    >
                      <option value="Work">Work</option>
                      <option value="Personal">Personal</option>
                      <option value="Health">Health</option>
                      <option value="Creative Project">Creative</option>
                    </select>
                    <select 
                      value={newTaskPriority}
                      onChange={(e) => setNewTaskPriority(e.target.value)}
                      class="bg-gray-100/80 dark:bg-gray-800/80 text-xs rounded-xl px-3 py-2 border-none outline-none font-medium"
                    >
                      <option value="low">Low</option>
                      <option value="medium">Medium</option>
                      <option value="high">High</option>
                      <option value="critical">Critical</option>
                    </select>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-5 py-2 rounded-xl transition shadow-md shadow-blue-500/20">
                      Tambah
                    </button>
                  </div>
                </form>

                {/* Task List */}
                <div class="glass p-6 rounded-3xl space-y-4">
                  <div class="flex justify-between items-center">
                    <h3 class="font-bold text-lg">Daftar Agenda Hari Ini</h3>
                    <button onClick={exportCSV} class="text-xs text-blue-600 font-semibold hover:underline">Export CSV</button>
                  </div>

                  <div class="space-y-2.5">
                    {tasks.map(task => (
                      <div key={task.id} class="flex items-center justify-between p-4 bg-white/60 dark:bg-gray-800/60 rounded-2xl border border-gray-100/80 dark:border-gray-800/80 hover:shadow-sm transition">
                        <div class="flex items-center gap-3.5">
                          <input 
                            type="checkbox" 
                            checked={task.status === 'completed'}
                            onChange={() => toggleTaskStatus(task.id)}
                            class="w-5 h-5 accent-blue-600 rounded-lg cursor-pointer"
                          />
                          <div>
                            <p class={`text-sm font-semibold ${task.status === 'completed' ? 'line-through text-gray-400 dark:text-gray-500' : ''}`}>
                              {task.title}
                            </p>
                            <div class="flex gap-2 mt-1">
                              <span class="text-[10px] bg-blue-50 text-blue-600 dark:bg-blue-900/40 dark:text-blue-300 px-2 py-0.5 rounded-md font-medium">
                                {task.category}
                              </span>
                              <span class={`text-[10px] px-2 py-0.5 rounded-md font-medium ${
                                task.priority === 'critical' ? 'bg-red-50 text-red-600 dark:bg-red-900/40 dark:text-red-300' :
                                task.priority === 'high' ? 'bg-orange-50 text-orange-600 dark:bg-orange-900/40 dark:text-orange-300' : 
                                'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400'
                              }`}>
                                {task.priority.toUpperCase()}
                              </span>
                            </div>
                          </div>
                        </div>
                        <button onClick={() => deleteTask(task.id)} class="text-xs text-red-500 hover:text-red-700 font-medium px-2 py-1">
                          Hapus
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            <!-- TASKS TAB -->
            {activeTab === 'tasks' && (
              <div class="max-w-4xl mx-auto space-y-6">
                <div class="glass p-6 rounded-3xl">
                  <h2 class="text-2xl font-bold">Agenda Saya</h2>
                  <p class="text-xs text-gray-500 mt-1">Kelola seluruh daftar aktivitas harian Anda dengan mudah.</p>
                </div>
                <div class="glass p-6 rounded-3xl space-y-3">
                  {tasks.map(t => (
                    <div key={t.id} class="flex justify-between items-center p-3 bg-white/40 dark:bg-gray-800/40 rounded-xl">
                      <div>
                        <span class="font-semibold text-sm">{t.title}</span>
                        <div class="text-[11px] text-gray-400">{t.task_date} • {t.category}</div>
                      </div>
                      <span class={`text-xs px-2.5 py-1 rounded-full font-medium ${t.status === 'completed' ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-700'}`}>
                        {t.status}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <!-- FOCUS MODE TAB -->
            {activeTab === 'focus' && (
              <div class="max-w-md mx-auto text-center space-y-6 pt-8">
                <div class="glass p-10 rounded-3xl shadow-xl border border-white/50">
                  <span class="text-xs font-bold text-blue-600 uppercase tracking-widest">Focus Mode Pomodoro</span>
                  <h2 class="text-7xl font-black tracking-tight my-8 font-mono">
                    {Math.floor(focusTime / 60).toString().padStart(2, '0')}:
                    {(focusTime % 60).toString().padStart(2, '0')}
                  </h2>
                  <div class="flex justify-center gap-3">
                    <button 
                      onClick={() => setIsTimerRunning(!isTimerRunning)} 
                      class="bg-blue-600 text-white px-8 py-3.5 rounded-2xl font-bold text-sm shadow-lg shadow-blue-500/30 hover:bg-blue-700 transition"
                    >
                      {isTimerRunning ? 'Pause' : 'Mulai Fokus'}
                    </button>
                    <button 
                      onClick={() => { setIsTimerRunning(false); setFocusTime(25 * 60); }} 
                      class="bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 px-6 py-3.5 rounded-2xl font-bold text-sm hover:bg-gray-300 transition"
                    >
                      Reset
                    </button>
                  </div>
                </div>
              </div>
            )}

            <!-- NOTES TAB -->
            {activeTab === 'notes' && (
              <div class="max-w-4xl mx-auto space-y-6">
                <form onSubmit={handleAddNote} class="glass p-6 rounded-3xl space-y-3">
                  <h3 class="font-bold text-lg">Tambah Catatan / Ide Baru</h3>
                  <input 
                    type="text" 
                    placeholder="Judul Catatan..." 
                    value={newNoteTitle} 
                    onChange={(e) => setNewNoteTitle(e.target.value)}
                    class="w-full bg-white/50 dark:bg-gray-800/50 p-3 rounded-xl border-none text-sm outline-none font-semibold"
                  />
                  <textarea 
                    placeholder="Tulis ide atau deskripsi di sini..." 
                    value={newNoteContent} 
                    onChange={(e) => setNewNoteContent(e.target.value)}
                    class="w-full bg-white/50 dark:bg-gray-800/50 p-3 rounded-xl border-none text-sm outline-none h-24"
                  />
                  <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-xl text-xs font-semibold shadow-md">Simpan Catatan</button>
                </form>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {notes.map(note => (
                    <div key={note.id} class="glass p-5 rounded-3xl space-y-2 relative group">
                      <h4 class="font-bold text-base">{note.title}</h4>
                      <p class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">{note.content}</p>
                      <button onClick={() => deleteNote(note.id)} class="text-xs text-red-500 font-semibold hover:underline pt-2 block">Hapus</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <!-- STATS TAB -->
            {activeTab === 'stats' && (
              <div class="max-w-4xl mx-auto space-y-6">
                <div class="glass p-6 rounded-3xl">
                  <h2 class="text-2xl font-bold">Statistik Produktivitas</h2>
                  <p class="text-xs text-gray-500 mt-1">Ringkasan aktivitas harian berdasarkan data aktual Anda.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="glass p-6 rounded-3xl">
                    <span class="text-xs text-gray-400 font-semibold uppercase">Penyelesaian Agenda</span>
                    <p class="text-4xl font-black text-blue-600 mt-2">{completedCount} / {tasks.length}</p>
                    <p class="text-xs text-gray-500 mt-1">Agenda berhasil diselesaikan</p>
                  </div>
                  <div class="glass p-6 rounded-3xl">
                    <span class="text-xs text-gray-400 font-semibold uppercase">Tingkat Efisiensi</span>
                    <p class="text-4xl font-black text-green-500 mt-2">{progressPercent}%</p>
                    <p class="text-xs text-gray-500 mt-1">Skor Produktivitas Harian</p>
                  </div>
                </div>
              </div>
            )}

            <!-- ADMIN PANEL TAB -->
            {activeTab === 'admin' && (
              <div class="max-w-4xl mx-auto space-y-6">
                {userRole !== 'admin' ? (
                  <div class="glass p-8 rounded-3xl text-center text-red-500 border border-red-200">
                    <h2 class="text-xl font-bold">Akses Ditolak (RBAC Enforced)</h2>
                    <p class="text-xs mt-2 text-gray-500">Gunakan switch role di sidebar bawah untuk mengakses fitur administrator.</p>
                  </div>
                ) : (
                  <div class="space-y-6">
                    <div class="glass p-6 rounded-3xl">
                      <h2 class="text-2xl font-bold mb-4">Master Control Panel</h2>
                      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="p-4 bg-white/50 dark:bg-gray-800/50 rounded-2xl border border-gray-100 dark:border-gray-800">
                          <p class="text-xs text-gray-400 font-semibold">Pengguna Terdaftar</p>
                          <p class="text-2xl font-black mt-1">1,248</p>
                        </div>
                        <div class="p-4 bg-white/50 dark:bg-gray-800/50 rounded-2xl border border-gray-100 dark:border-gray-800">
                          <p class="text-xs text-gray-400 font-semibold">Total Agenda Sistem</p>
                          <p class="text-2xl font-black mt-1">18,920</p>
                        </div>
                        <div class="p-4 bg-white/50 dark:bg-gray-800/50 rounded-2xl border border-gray-100 dark:border-gray-800">
                          <p class="text-xs text-gray-400 font-semibold">Status Layanan</p>
                          <p class="text-2xl font-black text-green-500 mt-1">Normal</p>
                        </div>
                      </div>
                    </div>

                    <div class="glass p-6 rounded-3xl space-y-4">
                      <h3 class="font-bold text-base">Pengaturan Fitur Global</h3>
                      <div class="flex items-center justify-between p-3.5 bg-white/40 dark:bg-gray-800/40 rounded-2xl">
                        <span class="text-sm font-semibold">Izinkan Registrasi Pengguna Baru</span>
                        <input type="checkbox" defaultChecked class="w-4 h-4 accent-blue-600" />
                      </div>
                      <div class="flex items-center justify-between p-3.5 bg-white/40 dark:bg-gray-800/40 rounded-2xl">
                        <span class="text-sm font-semibold">Mode Pemeliharaan (Maintenance)</span>
                        <input type="checkbox" class="w-4 h-4 accent-blue-600" />
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
